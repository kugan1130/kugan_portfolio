<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="100%" height="100%" style="background-color: #f4f7fb; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e1e8f0" stroke-width="1" />
    </pattern>
    
    <!-- Gradient Filters & Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="user-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="fastapi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="auth-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f52ba" />
      <stop offset="100%" stop-color="#032b69" />
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <linearGradient id="llm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31107d" />
      <stop offset="100%" stop-color="#1e0854" />
    </linearGradient>

    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="db-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <linearGradient id="db-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Arrow Marker Defs -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background Grid Fill -->
  <rect width="100%" height="100%" fill="#f4f7fb" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer Frame Blueprint Lines -->
  <rect x="20" y="20" width="1560" height="880" rx="20" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 4" />

  <!-- ================= 1. TOP USER UI CARD ================= -->
  <g transform="translate(620, 35)" filter="url(#shadow-md)">
    <rect x="0" y="0" width="360" height="52" rx="14" fill="url(#user-grad)" stroke="#60a5fa" stroke-width="2" />
    <!-- Icon -->
    <rect x="18" y="14" width="24" height="24" rx="4" fill="#ffffff" fill-opacity="0.2" />
    <path d="M22 20 h16 v12 h-16 z M24 24 h2 M28 24 h2 M32 24 h2 M24 28 h10" stroke="#ffffff" stroke-width="2" fill="none" />
    <text x="56" y="32" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">USER / UI (React + TypeScript)</text>
  </g>

  <!-- Arrow down to FastAPI -->
  <line x1="800" y1="87" x2="800" y2="128" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="710" y="100" width="180" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="800" y="114" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">Chat / Upload / Login</text>

  <!-- ================= 2. FASTAPI BACKEND BOX ================= -->
  <g transform="translate(420, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="760" height="90" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <text x="380" y="26" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="800" letter-spacing="1">⚙️ FASTAPI BACKEND</text>
    
    <!-- API Badges inside -->
    <g transform="translate(40, 42)">
      <!-- Auth API -->
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="70" y="22" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">🔑 Auth API</text>
      <path d="M 148 17 L 168 17" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Chat API -->
      <rect x="175" y="0" width="140" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="245" y="22" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">💬 Chat API</text>
      <path d="M 323 17 L 343 17" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Document API -->
      <rect x="350" y="0" width="150" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="425" y="22" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">📄 Document API</text>
      <path d="M 508 17 L 528 17" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Session API -->
      <rect x="535" y="0" width="145" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="607" y="22" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">⚙️ Session API</text>
    </g>
  </g>

  <!-- Split Paths from FastAPI -->
  <!-- Left Split to Auth -->
  <path d="M 600 220 L 600 240 L 410 240 L 410 260" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <!-- Right Split to Chat Workflow -->
  <path d="M 1000 220 L 1000 240 L 980 240 L 980 260" fill="none" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- ================= 3. LEFT BRANCH: AUTH & POSTGRESQL ================= -->
  <g transform="translate(260, 265)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="44" rx="10" fill="url(#auth-grad)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="150" y="27" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">🔒 Authentication / Authorization</text>
  </g>

  <line x1="410" y1="309" x2="410" y2="340" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- PostgreSQL Database Pill -->
  <g transform="translate(325, 342)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="36" rx="18" fill="url(#db-orange)" stroke="#ea580c" stroke-width="1.5" />
    <text x="85" y="23" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="800">🗄️ PostgreSQL</text>
  </g>

  <!-- ================= 4. RIGHT BRANCH: CHAT WORKFLOW (LANGGRAPH) ================= -->
  <g transform="translate(830, 265)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="44" rx="10" fill="url(#purple-grad)" stroke="#a855f7" stroke-width="1.5" />
    <text x="150" y="27" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">🔀 Chat Workflow (LangGraph)</text>
  </g>

  <line x1="980" y1="309" x2="980" y2="340" stroke="#7e22ce" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Guardrails Diamond -->
  <g transform="translate(980, 365)">
    <polygon points="0,-22 70,0 0,22 -70,0" fill="#ffffff" stroke="#475569" stroke-width="2" filter="url(#shadow)" />
    <text x="0" y="4" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="800">Guardrails</text>
  </g>

  <!-- Guardrails Left Branch: BLOCKED -> Safe Response -->
  <path d="M 910 365 L 750 365 L 750 405" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="800" y="352" width="70" height="18" rx="4" fill="#fee2e2" />
  <text x="835" y="365" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="800">BLOCKED</text>

  <g transform="translate(680, 408)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="38" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5" />
    <text x="70" y="24" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">🛡️ Safe Response</text>
  </g>

  <!-- Guardrails Right Branch: ALLOWED -> Supervisor -->
  <path d="M 1050 365 L 1200 365 L 1200 405" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="1080" y="352" width="75" height="18" rx="4" fill="#dcfce7" />
  <text x="1117" y="365" text-anchor="middle" fill="#166534" font-size="10" font-weight="800">ALLOWED</text>

  <g transform="translate(1130, 408)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="38" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5" />
    <text x="70" y="24" text-anchor="middle" fill="#14532d" font-size="12" font-weight="700">🎧 Supervisor</text>
  </g>

  <!-- ================= 5. SUPERVISOR 5 PARALLEL AGENT BRANCHES ================= -->
  <!-- Fan-out line from Supervisor -->
  <path d="M 1200 446 L 1200 470 L 680 470 L 680 490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 810 470 L 810 490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 940 470 L 940 490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 1070 470 L 1070 490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 1200 470 L 1200 490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 1. DIRECT -->
  <g transform="translate(630, 492)">
    <rect x="0" y="0" width="100" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <text x="50" y="18" text-anchor="middle" fill="#334155" font-size="11" font-weight="800">DIRECT</text>
    <line x1="50" y1="28" x2="50" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="10" y="50" width="80" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="50" y="69" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="700">Memory</text>
  </g>

  <!-- 2. RAG -->
  <g transform="translate(760, 492)">
    <rect x="0" y="0" width="100" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <text x="50" y="18" text-anchor="middle" fill="#334155" font-size="11" font-weight="800">RAG</text>
    <line x1="50" y1="28" x2="50" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- ChromaDB -->
    <rect x="0" y="50" width="100" height="30" rx="15" fill="url(#db-blue)" stroke="#0284c7" stroke-width="1" />
    <text x="50" y="69" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="800">🗄️ ChromaDB</text>
  </g>

  <!-- 3. SQL -->
  <g transform="translate(890, 492)">
    <rect x="0" y="0" width="100" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <text x="50" y="18" text-anchor="middle" fill="#334155" font-size="11" font-weight="800">SQL</text>
    <line x1="50" y1="28" x2="50" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- PostgreSQL -->
    <rect x="-10" y="50" width="120" height="30" rx="15" fill="url(#db-orange)" stroke="#ea580c" stroke-width="1" />
    <text x="50" y="69" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="800">🗄️ PostgreSQL</text>
  </g>

  <!-- 4. WEB -->
  <g transform="translate(1020, 492)">
    <rect x="0" y="0" width="100" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <text x="50" y="18" text-anchor="middle" fill="#334155" font-size="11" font-weight="800">WEB</text>
    <line x1="50" y1="28" x2="50" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="-5" y="50" width="110" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="50" y="69" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="700">🌐 Web Search</text>
  </g>

  <!-- 5. TASK -->
  <g transform="translate(1150, 492)">
    <rect x="0" y="0" width="100" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <text x="50" y="18" text-anchor="middle" fill="#334155" font-size="11" font-weight="800">TASK</text>
    <line x1="50" y1="28" x2="50" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="-10" y="50" width="120" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="50" y="69" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="700">💼 Backend Tools</text>
  </g>

  <!-- ================= 6. CONTEXT / RESULTS CONVERGENCE BAR ================= -->
  <!-- Lines down to bar -->
  <line x1="680" y1="572" x2="680" y2="600" stroke="#475569" stroke-width="2" />
  <line x1="810" y1="572" x2="810" y2="600" stroke="#475569" stroke-width="2" />
  <line x1="940" y1="572" x2="940" y2="600" stroke="#475569" stroke-width="2" />
  <line x1="1070" y1="572" x2="1070" y2="600" stroke="#475569" stroke-width="2" />
  <line x1="1200" y1="572" x2="1200" y2="600" stroke="#475569" stroke-width="2" />

  <!-- Horizontal bar -->
  <rect x="650" y="600" width="580" height="6" rx="3" fill="#475569" />

  <!-- Down arrow Context / Results -->
  <line x1="940" y1="606" x2="940" y2="640" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="860" y="615" width="160" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="940" y="628" text-anchor="middle" fill="#334155" font-size="10" font-weight="700">Context / Results</text>

  <!-- ================= 7. LLM SYNTHESIS CARD ================= -->
  <g transform="translate(730, 642)" filter="url(#shadow-md)">
    <rect x="0" y="0" width="420" height="46" rx="12" fill="url(#llm-grad)" stroke="#a855f7" stroke-width="1.5" />
    <text x="210" y="28" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="0.5">🧠 LLM SYNTHESIS (Groq Llama 3.3 70B)</text>
  </g>

  <line x1="940" y1="688" x2="940" y2="718" stroke="#581c87" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ================= 8. REFLECTION / CRITIC CARD ================= -->
  <g transform="translate(770, 720)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="44" rx="10" fill="url(#orange-grad)" stroke="#f97316" stroke-width="1.5" />
    <text x="170" y="27" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">🧾 Reflection / Critic</text>
  </g>

  <!-- Retry Loop Path (Red) -->
  <path d="M 1110 742 L 1310 742 L 1310 665 L 1155 665" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <rect x="1200" y="728" width="60" height="18" rx="4" fill="#fee2e2" />
  <text x="1230" y="741" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="800">RETRY</text>

  <!-- Pass Path (Green) -->
  <path d="M 770 742 L 560 742 L 560 780" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="630" y="728" width="50" height="18" rx="4" fill="#dcfce7" />
  <text x="655" y="741" text-anchor="middle" fill="#166534" font-size="10" font-weight="800">PASS</text>

  <!-- Aggregate -->
  <g transform="translate(500, 782)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="60" y="22" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="700">Aggregate</text>
  </g>

  <!-- Line from Aggregate to Final Collector Bar -->
  <path d="M 560 816 L 560 835 L 940 835" fill="none" stroke="#475569" stroke-width="2" />

  <!-- Final Answer Collector Line -->
  <rect x="650" y="835" width="580" height="5" rx="2.5" fill="#475569" />

  <line x1="940" y1="840" x2="940" y2="860" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Final Answer Box -->
  <g transform="translate(870, 862)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="70" y="21" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="800">Final Answer</text>
  </g>

  <line x1="940" y1="894" x2="940" y2="905" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

</svg>
